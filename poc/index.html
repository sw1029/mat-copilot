<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>mat-copilot — POC</title>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
  :root{
    --bg:#0f1117; --bg2:#151823; --panel:#1b1f2e; --panel2:#20263a;
    --line:#2c3450; --text:#e8ecf6; --sub:#9aa5c0; --accent:#6c8cff; --accent2:#8f6cff;
    --good:#3ecf8e; --warn:#f5a623; --bad:#ff5d6c; --na:#7a86a8;
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body,#root{height:100%; overflow:hidden;}
  body{
    background:radial-gradient(1200px 800px at 70% -10%, #1c2340 0%, var(--bg) 55%);
    color:var(--text);
    font-family:'Segoe UI','Pretendard','Apple SD Gothic Neo',sans-serif;
  }
  button{font-family:inherit;}

  /* ---------- shell ---------- */
  .shell{display:flex; flex-direction:column; height:100vh;}
  .topbar{
    height:56px; flex:0 0 56px; display:flex; align-items:center; gap:14px;
    padding:0 18px; border-bottom:1px solid var(--line);
    background:rgba(15,17,23,.75); backdrop-filter:blur(8px); z-index:50;
  }
  .home-btn{
    display:flex; align-items:center; gap:9px; background:none; border:none; cursor:pointer;
    color:var(--text); font-size:16px; font-weight:700; padding:6px 10px; border-radius:10px;
    transition:background .2s;
  }
  .home-btn:hover{background:rgba(108,140,255,.12);}
  .logo-dot{
    width:26px;height:26px;border-radius:8px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;
    box-shadow:0 0 16px rgba(108,140,255,.5);
  }
  .phase-steps{display:flex; gap:6px; margin-left:auto; align-items:center;}
  .phase-step{
    font-size:12px; color:var(--sub); padding:5px 12px; border-radius:99px;
    border:1px solid transparent; transition:all .35s;
  }
  .phase-step.on{
    color:#fff; border-color:var(--accent);
    background:rgba(108,140,255,.15); box-shadow:0 0 12px rgba(108,140,255,.25);
  }
  .phase-step.done{color:var(--good);}
  .phase-arrow{color:#3a4260; font-size:11px;}
  .main{flex:1; position:relative; overflow:hidden;}

  .screen{position:absolute; inset:0; animation:screenIn .5s ease both;}
  @keyframes screenIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}

  /* ---------- home ---------- */
  .home{display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:26px; padding:20px;}
  .hero-title{
    font-size:34px; font-weight:800; letter-spacing:-.5px; text-align:center;
    background:linear-gradient(90deg,#fff,#b9c6ff); -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:floatIn .8s ease both;
  }
  .hero-sub{color:var(--sub); font-size:15px; text-align:center; animation:floatIn .8s .12s ease both;}
  @keyframes floatIn{from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:none;}}

  /* ---------- question card ---------- */
  .qcard{
    width:460px; max-width:92vw; background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius); padding:20px; box-shadow:0 18px 50px rgba(0,0,0,.45);
    animation:floatIn .7s .2s ease both;
  }
  .qcard .badge-row{display:flex; gap:8px; margin-bottom:10px; align-items:center;}
  .badge-row{display:flex; gap:8px; margin-bottom:10px; align-items:center;}
  .badge{font-size:11px; padding:3px 9px; border-radius:99px; font-weight:700;}
  .badge.req{background:rgba(108,140,255,.18); color:var(--accent);}
  .badge.opt{background:rgba(143,108,255,.18); color:#b49bff;}
  .badge.step{background:rgba(255,255,255,.06); color:var(--sub); font-weight:500;}
  .qcard h3{font-size:17px; line-height:1.5; margin-bottom:6px;}
  .helper{font-size:12.5px; color:var(--sub); margin-bottom:14px; line-height:1.55;}
  textarea.answer{
    width:100%; min-height:86px; resize:vertical; border-radius:10px;
    border:1px solid var(--line); background:var(--bg2); color:var(--text);
    padding:11px 12px; font-size:14px; font-family:inherit; line-height:1.55;
    transition:border .2s, box-shadow .2s;
  }
  textarea.answer:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(108,140,255,.18);}
  .qcard-foot{display:flex; justify-content:space-between; align-items:center; margin-top:11px;}
  .hint{font-size:11.5px; color:var(--sub);}
  .hint.err{color:var(--warn);}
  .submit-btn{
    border:none; cursor:pointer; border-radius:10px; padding:9px 20px; font-size:14px; font-weight:700;
    color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent2));
    transition:transform .15s, opacity .2s, box-shadow .2s;
    box-shadow:0 6px 18px rgba(108,140,255,.35);
  }
  .submit-btn:hover:not(:disabled){transform:translateY(-1px); box-shadow:0 9px 24px rgba(108,140,255,.5);}
  .submit-btn:disabled{opacity:.4; cursor:not-allowed; box-shadow:none;}

  /* ---------- optional doc upload ---------- */
  .upload-card{
    width:460px; max-width:92vw; display:flex; align-items:center; gap:10px;
    background:rgba(27,31,46,.6); border:1px dashed var(--line); border-radius:12px;
    padding:11px 14px; font-size:12.5px; color:var(--sub); line-height:1.5;
    animation:floatIn .7s .15s ease both;
  }
  .upload-card .ok{color:var(--good);}
  .upload-card .dl-btn{flex:0 0 auto; white-space:nowrap;}

  /* ---------- interview canvas ---------- */
  .canvas-wrap{position:absolute; inset:0; overflow:hidden; cursor:grab; touch-action:none;}
  .canvas-wrap.dragging{cursor:grabbing;}
  .canvas-wrap::before{
    content:''; position:absolute; inset:0;
    background-image:radial-gradient(circle, #2a3050 1px, transparent 1px);
    background-size:26px 26px; opacity:.5;
  }
  .canvas-inner{position:absolute; top:0; left:0; will-change:transform;}
  .edges{position:absolute; top:0; left:0; overflow:visible; pointer-events:none;}
  .edge{
    fill:none; stroke:url(#edgeGrad); stroke-width:2.2; stroke-linecap:round;
    stroke-dasharray:1; stroke-dashoffset:1;
    animation:drawEdge .7s .1s ease forwards;
  }
  @keyframes drawEdge{to{stroke-dashoffset:0;}}
  .edge-dot{fill:var(--accent2); animation:popIn .4s .6s ease both; transform:scale(0); transform-box:fill-box; transform-origin:center;}
  @keyframes popIn{from{transform:scale(0); opacity:0;} to{transform:scale(1); opacity:1;}}

  .node{
    position:absolute; width:280px; background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius); padding:14px;
    animation:nodeIn .55s cubic-bezier(.2,.9,.3,1.2) both;
    transition:left .5s ease, top .5s ease, border-color .3s, box-shadow .3s;
    cursor:default;
  }
  @keyframes nodeIn{from{opacity:0; transform:translateX(-18px) scale(.92);} to{opacity:1; transform:none;}}
  .node .q{font-size:13.5px; font-weight:600; line-height:1.5; margin:7px 0 4px;}
  .node .a-sum{
    font-size:12px; color:var(--sub); line-height:1.5; margin-top:6px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; cursor:pointer;
  }
  .node .a-sum.expanded{display:block;}
  .node.done{opacity:.92;}
  .node.done .stat{color:var(--good);}
  .node.active{
    border-color:var(--accent);
    animation:nodeIn .55s cubic-bezier(.2,.9,.3,1.2) both, glow 2.4s 1s ease-in-out infinite;
    width:340px; z-index:5;
  }
  @keyframes glow{
    0%,100%{box-shadow:0 0 0 3px rgba(108,140,255,.14), 0 14px 44px rgba(0,0,0,.5);}
    50%{box-shadow:0 0 0 5px rgba(108,140,255,.3), 0 14px 44px rgba(0,0,0,.5);}
  }
  .node .stat{font-size:11px; font-weight:700; letter-spacing:.4px;}
  .node.active .stat{color:var(--accent);}
  .node.skeleton{
    border-style:dashed; display:flex; flex-direction:column; gap:9px; min-height:96px; justify-content:center;
  }
  .sk-line{height:11px; border-radius:6px; background:linear-gradient(90deg,#232a42 25%,#2e3757 50%,#232a42 75%); background-size:200% 100%; animation:shimmer 1.3s infinite linear;}
  @keyframes shimmer{from{background-position:200% 0;} to{background-position:-200% 0;}}
  .node textarea.answer{min-height:72px; margin-top:8px; font-size:13px;}

  .canvas-fab{
    position:absolute; right:20px; bottom:20px; z-index:20; display:flex; gap:10px;
  }
  .fab{
    border:1px solid var(--line); background:var(--panel); color:var(--text); cursor:pointer;
    padding:10px 16px; border-radius:99px; font-size:13px; font-weight:600;
    box-shadow:0 8px 24px rgba(0,0,0,.4); transition:all .2s;
  }
  .fab:hover{border-color:var(--accent); transform:translateY(-2px);}
  .canvas-tip{
    position:absolute; left:20px; bottom:20px; z-index:20; font-size:12px; color:var(--sub);
    background:rgba(21,24,35,.8); border:1px solid var(--line); padding:8px 14px; border-radius:99px;
    animation:floatIn .6s .5s both;
  }

  /* ---------- waiting ---------- */
  .waiting{display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:34px;}
  .stages{display:flex; flex-direction:column; gap:0; width:430px; max-width:90vw;}
  .stage{display:flex; gap:16px; align-items:stretch;}
  .stage-rail{display:flex; flex-direction:column; align-items:center;}
  .stage-icon{
    width:40px; height:40px; border-radius:50%; flex:0 0 40px;
    display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:800;
    border:2px solid var(--line); color:var(--sub); background:var(--panel);
    transition:all .4s;
  }
  .stage.running .stage-icon{border-color:var(--accent); color:var(--accent);}
  .stage.done .stage-icon{border-color:var(--good); color:#0c1a14; background:var(--good); animation:popScale .45s cubic-bezier(.2,1.4,.4,1) both;}
  .stage.failed .stage-icon{border-color:var(--bad); color:var(--bad);}
  @keyframes popScale{from{transform:scale(.4);} to{transform:scale(1);}}
  .stage-line{width:2px; flex:1; min-height:34px; background:var(--line); transition:background .5s;}
  .stage.done .stage-line{background:var(--good);}
  .stage-body{padding:8px 0 26px;}
  .stage-title{font-size:15.5px; font-weight:700;}
  .stage-sub{font-size:12.5px; color:var(--sub); margin-top:4px; min-height:18px; transition:opacity .3s;}
  .stage.running .stage-title{color:var(--accent);}
  .spinner{
    width:18px; height:18px; border-radius:50%;
    border:2.5px solid rgba(108,140,255,.25); border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .stage-bar{height:5px; border-radius:99px; background:var(--line); margin-top:9px; overflow:hidden; width:290px;}
  .stage-bar > div{height:100%; border-radius:99px; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .3s linear;}
  .retry-btn{
    margin-top:8px; border:1px solid var(--bad); color:var(--bad); background:none; border-radius:9px;
    padding:6px 16px; font-size:12.5px; cursor:pointer; font-weight:700;
  }
  .retry-btn:hover{background:rgba(255,93,108,.1);}

  /* ---------- result ---------- */
  .result{display:flex; height:100%;}
  .col-docs{width:30%; min-width:320px; border-right:1px solid var(--line); display:flex; flex-direction:column;}
  .doc-panel{flex:1 1 50%; min-height:0; display:flex; flex-direction:column; overflow:hidden;}
  .doc-panel + .doc-panel{border-top:1px solid var(--line);}
  .no-trd{
    flex:0 0 auto; border-top:1px solid var(--line); background:var(--bg2);
    padding:12px 16px; font-size:12.5px; color:var(--sub); line-height:1.6;
    animation:floatIn .5s both;
  }
  .doc-head{
    flex:0 0 auto; display:flex; align-items:center; gap:9px; padding:10px 14px;
    border-bottom:1px solid var(--line); background:var(--bg2);
  }
  .doc-head .t{font-size:13px; font-weight:800;}
  .doc-head .ok{font-size:10.5px; color:var(--good); background:rgba(62,207,142,.12); padding:2px 8px; border-radius:99px;}
  .dl-btn{
    margin-left:auto; font-size:11.5px; border:1px solid var(--line); background:none; color:var(--sub);
    border-radius:8px; padding:4px 10px; cursor:pointer; transition:all .2s;
  }
  .dl-btn:hover{color:var(--text); border-color:var(--accent);}
  .doc-body{flex:1; overflow-y:auto; padding:14px 16px 30px; font-size:13px; line-height:1.7; scroll-behavior:smooth;}
  .doc-body h1{font-size:17px; margin:8px 0 10px;}
  .doc-body h2{font-size:14.5px; margin:16px 0 7px; color:#c9d4f5;}
  .doc-body h3{font-size:13.5px; margin:12px 0 5px; color:#b6c2e8;}
  .doc-body p{margin:6px 0;}
  .doc-body ul{margin:6px 0 6px 18px;}
  .doc-body li{margin:3px 0;}
  .doc-body code{background:#262d47; border-radius:5px; padding:1px 6px; font-size:12px;}

  .fn-span{border-bottom:2px dotted transparent; border-radius:4px; padding:0 2px; transition:all .3s; cursor:pointer;}
  .fn-span.st-match{border-color:var(--good);}
  .fn-span.st-partial{border-color:var(--warn);}
  .fn-span.st-distortion{border-color:var(--bad); border-bottom-style:solid;}
  .fn-span.st-missing{border-color:var(--bad); border-bottom-style:dashed;}
  .fn-span.st-added{border-color:var(--accent2); border-bottom-style:solid;}
  .fn-span.sel{background:rgba(108,140,255,.2); box-shadow:0 0 0 2px rgba(108,140,255,.3); animation:flash .8s ease;}
  @keyframes flash{0%{background:rgba(108,140,255,.5);} 100%{background:rgba(108,140,255,.2);}}
  sup.fn{
    display:inline-flex; align-items:center; justify-content:center; min-width:17px; height:17px;
    margin-left:3px; border-radius:6px; font-size:10.5px; font-weight:800; cursor:pointer;
    vertical-align:super; transition:all .2s; user-select:none;
  }
  sup.fn.st-match{background:rgba(62,207,142,.16); color:var(--good);}
  sup.fn.st-partial{background:rgba(245,166,35,.16); color:var(--warn);}
  sup.fn.st-distortion,sup.fn.st-missing{background:rgba(255,93,108,.16); color:var(--bad);}
  sup.fn.st-added{background:rgba(143,108,255,.18); color:#b49bff;}
  sup.fn:hover{transform:scale(1.2);}
  sup.fn.sel{outline:2px solid var(--accent); outline-offset:1px;}

  .col-right{flex:1; display:flex; flex-direction:column; min-width:0;}
  .metrics-area{flex:1 1 40%; min-height:0; overflow:hidden; padding:14px 20px; display:flex; flex-direction:column;}
  .metrics-title{font-size:15px; font-weight:800; margin-bottom:3px;}
  .metrics-sub{font-size:12px; color:var(--sub); margin-bottom:10px;}
  .metric-grid{display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:10px; flex:1; min-height:0; align-items:stretch;}
  .metric-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:11px 12px; cursor:pointer; transition:transform .25s, border-color .25s, box-shadow .25s; position:relative;
    animation:floatIn .5s both; min-width:0; display:flex; flex-direction:column; justify-content:center;
  }
  .metric-card:hover{transform:translateY(-3px); border-color:#3d4a75;}
  .metric-card.sel{border-color:var(--accent); box-shadow:0 0 0 3px rgba(108,140,255,.15);}
  .metric-label{font-size:11px; color:var(--sub); display:flex; align-items:center; gap:5px; white-space:nowrap; overflow:hidden;}
  .metric-label .lbl{overflow:hidden; text-overflow:ellipsis;}
  .info-dot{
    width:14px;height:14px;border-radius:50%;border:1px solid var(--sub);color:var(--sub);
    font-size:9px;display:inline-flex;align-items:center;justify-content:center; cursor:help; flex:0 0 14px;
  }
  .metric-value{font-size:clamp(15px, 1.5vw, 22px); font-weight:800; margin:6px 0 2px; letter-spacing:-.5px; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .metric-value .unit{font-size:11px; color:var(--sub); font-weight:600; margin-left:2px;}
  .metric-status{font-size:10.5px; font-weight:700; display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:99px; white-space:nowrap; align-self:flex-start;}
  .metric-status.good{background:rgba(62,207,142,.13); color:var(--good);}
  .metric-status.warn{background:rgba(245,166,35,.13); color:var(--warn);}
  .metric-status.bad{background:rgba(255,93,108,.13); color:var(--bad);}
  .metric-status.na{background:rgba(122,134,168,.15); color:var(--na);}
  .metric-bar{height:6px; border-radius:99px; background:#262d47; margin-top:8px; overflow:hidden;}
  .metric-bar > div{height:100%; border-radius:99px; transition:width 1.1s cubic-bezier(.2,.8,.3,1);}
  .metric-bar .good{background:linear-gradient(90deg,#2aa671,var(--good));}
  .metric-bar .warn{background:linear-gradient(90deg,#c47f11,var(--warn));}
  .metric-bar .bad{background:linear-gradient(90deg,#c2333f,var(--bad));}
  .metric-tip{
    position:absolute; left:10px; right:10px; bottom:calc(100% - 6px); z-index:30;
    background:#0c0e15; border:1px solid var(--line); border-radius:10px; padding:10px 12px;
    font-size:11.5px; color:var(--sub); line-height:1.5; pointer-events:none;
    opacity:0; transform:translateY(4px); transition:all .2s; box-shadow:0 10px 30px rgba(0,0,0,.5);
  }
  .metric-card:hover .metric-tip{opacity:1; transform:none;}

  .report-area{
    flex:1 1 60%; min-height:0; border-top:1px solid var(--line); background:var(--bg2);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .report-head{flex:0 0 auto; padding:10px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px;}
  .report-head .t{font-size:13px; font-weight:800;}
  .report-body{flex:1; overflow-y:auto; padding:14px 18px 26px;}
  .report-empty{color:var(--sub); font-size:13px; line-height:1.8; padding-top:6px;}
  .rp-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 22px; animation:floatIn .35s both;}
  .rp-full{grid-column:1/-1;}
  .rp-item .k{font-size:11px; color:var(--sub); font-weight:700; letter-spacing:.4px; margin-bottom:3px;}
  .rp-item .v{font-size:12.8px; line-height:1.65;}
  .quote{
    border-left:3px solid var(--accent); background:rgba(108,140,255,.07);
    padding:7px 11px; border-radius:0 8px 8px 0; font-size:12.3px; color:#cdd7f2; margin-top:3px; line-height:1.6;
  }
  .quote.trd{border-color:var(--accent2); background:rgba(143,108,255,.07);}
  .sev{font-size:11px; font-weight:800; padding:2px 9px; border-radius:99px;}
  .sev.high{background:rgba(255,93,108,.15); color:var(--bad);}
  .sev.medium{background:rgba(245,166,35,.15); color:var(--warn);}
  .sev.low{background:rgba(62,207,142,.15); color:var(--good);}
  .conf-bar{display:flex; align-items:center; gap:8px;}
  .conf-bar .track{flex:1; height:5px; background:#262d47; border-radius:99px; overflow:hidden;}
  .conf-bar .track div{height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:99px; transition:width .8s ease;}
  .goto-btn{
    border:1px solid var(--line); background:none; color:var(--accent); font-size:11.5px; cursor:pointer;
    border-radius:8px; padding:4px 11px; margin-left:auto; font-weight:700;
  }
  .goto-btn:hover{border-color:var(--accent);}

  /* ---------- modal ---------- */
  .modal-back{
    position:fixed; inset:0; background:rgba(5,7,12,.66); z-index:100;
    display:flex; align-items:center; justify-content:center; animation:fadeIn .2s both; backdrop-filter:blur(3px);
  }
  @keyframes fadeIn{from{opacity:0;}}
  .modal{
    width:390px; max-width:88vw; background:var(--panel); border:1px solid var(--line);
    border-radius:16px; padding:24px; animation:popScale .3s cubic-bezier(.2,1.3,.4,1) both;
  }
  .modal h4{font-size:16px; margin-bottom:9px;}
  .modal p{font-size:13px; color:var(--sub); line-height:1.65; margin-bottom:18px;}
  .modal-actions{display:flex; gap:10px; justify-content:flex-end;}
  .btn-ghost{border:1px solid var(--line); background:none; color:var(--text); border-radius:9px; padding:8px 16px; font-size:13px; cursor:pointer;}
  .btn-danger{border:none; background:var(--bad); color:#fff; border-radius:9px; padding:8px 16px; font-size:13px; font-weight:700; cursor:pointer;}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const {useState, useEffect, useRef, useCallback, useMemo} = React;

/* =====================================================================
 * Mock Backend — PRD/back.md 계약 시뮬레이션
 *  - 세션 발급(FR-11, 로그인 없음), 인터뷰 질의/응답 루프(FR-2~4),

const saveState = (s) => { try{ sessionStorage.setItem(STORE_KEY, JSON.stringify(s)); }catch(e){} };
const loadState = () => { try{ return JSON.parse(sessionStorage.getItem(STORE_KEY)); }catch(e){ return null; } };
const clearState = () => { try{ sessionStorage.removeItem(STORE_KEY); }catch(e){} };

/* =====================================================================
 * 공통 유틸
 * ===================================================================== */
function useCountUp(target, {duration=1000, decimals=0} = {}){
  const [val, setVal] = useState(0);
  useEffect(() => {
    if(target == null) return;
    let raf, start;
    const tick = (t) => {
      if(!start) start = t;
      const p = Math.min((t-start)/duration, 1);
      const eased = 1 - Math.pow(1-p, 3);
      setVal(target * eased);
      if(p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target]);
  if(target == null) return null;
  return val;
}

function downloadMd(name, text){
  const blob = new Blob([text.replace(/\[\[\d+:/g,'').replace(/\]\]/g,'')], {type:'text/markdown;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  URL.revokeObjectURL(a.href);
}

/* ---- 미니 Markdown 렌더러 (XSS-safe: 문자열을 React 노드로만 변환) ---- */
function renderInline(text, fnStatus, selectedFn, onFn){
  const parts = [];
  let rest = text, key = 0;
  const tokenRe = /\[\[(\d+):([^\]]*)\]\]/;
  while(rest){
    const m = rest.match(tokenRe);
    if(!m){ parts.push(...renderBold(rest, key)); break; }
    if(m.index > 0) parts.push(...renderBold(rest.slice(0, m.index), key));
    key += 100;
    const fn = parseInt(m[1],10);
    const st = fnStatus[fn] || 'match';
    const sel = selectedFn === fn;
    parts.push(
      <span key={'fn'+fn+'-'+(key++)} data-fn={fn}
        className={'fn-span st-'+st+(sel?' sel':'')}
        onClick={(e)=>{e.stopPropagation(); onFn(fn);}}>
        {renderBold(m[2], key+50)}
        <sup className={'fn st-'+st+(sel?' sel':'')} title={'각주 '+fn+' — 클릭하여 상세 보기'}>{fn}</sup>
      </span>
    );
    rest = rest.slice(m.index + m[0].length);
    key += 200;
  }
  return parts;
}
function renderBold(text, keyBase=0){
  return text.split(/(\*\*[^*]+\*\*|`[^`]+`)/g).filter(Boolean).map((seg,i)=>{
    if(seg.startsWith('**')) return <strong key={keyBase+i}>{seg.slice(2,-2)}</strong>;
    if(seg.startsWith('`')) return <code key={keyBase+i}>{seg.slice(1,-1)}</code>;
    return <React.Fragment key={keyBase+i}>{seg}</React.Fragment>;
  });
}
function Markdown({md, fnStatus, selectedFn, onFn}){
  const lines = md.split('\n');
  const out = []; let ul = null, k = 0;
  const flush = () => { if(ul){ out.push(<ul key={'ul'+(k++)}>{ul}</ul>); ul = null; } };
  for(const line of lines){
    if(line.startsWith('- ')){
      if(!ul) ul = [];
      ul.push(<li key={'li'+(k++)}>{renderInline(line.slice(2), fnStatus, selectedFn, onFn)}</li>);
      continue;
    }
    flush();
    if(line.startsWith('### ')) out.push(<h3 key={k++}>{renderInline(line.slice(4), fnStatus, selectedFn, onFn)}</h3>);
    else if(line.startsWith('## ')) out.push(<h2 key={k++}>{renderInline(line.slice(3), fnStatus, selectedFn, onFn)}</h2>);
    else if(line.startsWith('# ')) out.push(<h1 key={k++}>{renderInline(line.slice(2), fnStatus, selectedFn, onFn)}</h1>);
    else if(line.trim()) out.push(<p key={k++}>{renderInline(line, fnStatus, selectedFn, onFn)}</p>);
  }
  flush();
  return <React.Fragment>{out}</React.Fragment>;
}

/* =====================================================================
 * 답변 입력 폼 (첫 질문 카드 / 활성 노드 공용)
 * ===================================================================== */
function AnswerForm({onSubmit, sending, compact}){
  const [value, setValue] = useState('');
  const ref = useRef(null);
  useEffect(() => { if(ref.current) ref.current.focus(); }, []);
  const valid = value.trim().length >= 2;
  const submit = () => { if(valid && !sending){ onSubmit(value.trim()); } };
  return (
    <div className="no-drag">
      <textarea ref={ref} className="answer" value={value} disabled={sending}
        placeholder="답변을 입력하세요…"
        onChange={e=>setValue(e.target.value)}
        onKeyDown={e=>{
          if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); submit(); }
        }} />
      <div className="qcard-foot">
        <span className={'hint'+((value && !valid)?' err':'')}>
          {sending ? '전송 중…' : (!valid && value) ? '2자 이상 입력해 주세요' : 'Enter 제출 · Shift+Enter 줄바꿈'}
        </span>
        <button className="submit-btn" disabled={!valid || sending} onClick={submit}>
          {sending ? '전송 중…' : compact ? '답변' : '답변 제출'}
        </button>
      </div>
    </div>
  );
}

/* =====================================================================
 * 화면 2 — 인터뷰 마인드맵 (드래그 캔버스)
 * ===================================================================== */
const NODE_W = 280, NODE_W_ACTIVE = 340, GAP_X = 130, GAP_Y = 210, PAD_X = 70, PAD_Y = 90;

function computeLayout(nodes){
  const byParent = {};
  nodes.forEach(n => {
    const p = n.parentId == null ? '__root__' : n.parentId;
    if(!byParent[p]) byParent[p] = [];
    byParent[p].push(n);
  });
  const pos = {}; let nextRow = 0;
  const dfs = (n, depth) => {
    const kids = byParent[n.id] || [];
    let row;
    if(kids.length === 0){ row = nextRow++; }
    else {
      const rows = kids.map(k => dfs(k, depth+1));
      row = (rows[0] + rows[rows.length-1]) / 2;
    }
    pos[n.id] = {depth, row};
    return row;
  };
  (byParent['__root__'] || []).forEach(r => dfs(r, 0));
  return pos;
}

function InterviewScreen({visible, answers, activeId, sending, onSubmit, expandedId, setExpandedId}){
  const pos = useMemo(() => computeLayout(visible), [visible]);
  const [offset, setOffset] = useState({x:0, y:0});
  const [dragging, setDragging] = useState(false);
  const dragRef = useRef(null);
  const wrapRef = useRef(null);

  const xy = (id) => {
    const p = pos[id] || {depth:0, row:0};
    return {x: PAD_X + p.depth * (NODE_W + GAP_X), y: PAD_Y + p.row * GAP_Y};
  };

  const centerOn = useCallback((id) => {
    const wrap = wrapRef.current; if(!wrap || !pos[id]) return;
    const {x, y} = xy(id);
    const w = wrap.clientWidth, h = wrap.clientHeight;
    setOffset({x: w*0.55 - x - NODE_W_ACTIVE/2, y: h*0.42 - y});
  }, [pos]);

  // 새 활성 질문 등장 시 자동 위치 보정 (FR-7 자동 보정)
  useEffect(() => { if(activeId) centerOn(activeId); }, [activeId, centerOn]);
  useEffect(() => { if(sending && visible.length) centerOn(visible[visible.length-1].id); }, [sending]);

  const onPointerDown = (e) => {
    if(e.target.closest('textarea, button, input, a, .no-drag, .a-sum')) return;
    dragRef.current = {sx:e.clientX, sy:e.clientY, ox:offset.x, oy:offset.y};
    setDragging(true);
    e.currentTarget.setPointerCapture(e.pointerId);
  };
  const onPointerMove = (e) => {
    const d = dragRef.current; if(!d) return;
    setOffset({x: d.ox + (e.clientX - d.sx), y: d.oy + (e.clientY - d.sy)});
  };
  const onPointerUp = () => { dragRef.current = null; setDragging(false); };

  const skeletonPos = (sending && visible.length) ? (() => {
    const last = xy(visible[visible.length-1].id);
    return {x: last.x + NODE_W + GAP_X, y: last.y};
  })() : null;

  const anchor = (id, side) => {
    const p = xy(id);
    const w = id === activeId ? NODE_W_ACTIVE : NODE_W;
    return side === 'out' ? {x: p.x + w, y: p.y + 52} : {x: p.x, y: p.y + 52};
  };

  return (
    <div className="screen">
      <div ref={wrapRef} className={'canvas-wrap' + (dragging ? ' dragging' : '')}
        onPointerDown={onPointerDown} onPointerMove={onPointerMove}
        onPointerUp={onPointerUp} onPointerCancel={onPointerUp}>
        <div className="canvas-inner" style={{transform:'translate('+offset.x+'px, '+offset.y+'px)', transition: dragging ? 'none' : 'transform .55s cubic-bezier(.2,.8,.25,1)'}}>
          <svg className="edges" width="6000" height="4000">
            <defs>
              <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stopColor="#6c8cff" /><stop offset="1" stopColor="#8f6cff" />
              </linearGradient>
            </defs>
            {visible.filter(n => n.parentId && pos[n.parentId]).map(n => {
              const a = anchor(n.parentId, 'out'), b = anchor(n.id, 'in');
              const mx = (a.x + b.x) / 2;
              return (
                <g key={'e'+n.id}>
                  <path className="edge" pathLength="1"
                    d={'M '+a.x+' '+a.y+' C '+mx+' '+a.y+', '+mx+' '+b.y+', '+b.x+' '+b.y} />
                  <circle className="edge-dot" cx={b.x} cy={b.y} r="4" />
                </g>
              );
            })}
            {skeletonPos && visible.length > 0 && (() => {
              const a = anchor(visible[visible.length-1].id, 'out');
              const b = {x: skeletonPos.x, y: skeletonPos.y + 52};
              const mx = (a.x + b.x) / 2;
              return <path key="esk" className="edge" pathLength="1" style={{opacity:.45}}
                d={'M '+a.x+' '+a.y+' C '+mx+' '+a.y+', '+mx+' '+b.y+', '+b.x+' '+b.y} />;
            })()}
          </svg>

          {visible.map(n => {
            const p = xy(n.id);
            const isActive = n.id === activeId;
            const ans = answers[n.id];
            return (
              <div key={n.id}
                className={'node ' + (isActive ? 'active' : 'done')}
                style={{left:p.x, top:p.y}}>
                <div className="badge-row">
                  <span className={'badge ' + (n.kind==='필수' ? 'req' : 'opt')}>{n.kind}</span>
                  <span className="badge step">질문 {ORDER.indexOf(n.id)+1}</span>
                  <span className="stat" style={{marginLeft:'auto'}}>
                    {isActive ? (sending ? '⟳ 전송 중' : '● 활성') : '✓ 완료'}
                  </span>
                </div>
                <div className="q">{n.prompt}</div>
                {isActive && !sending && <div className="helper">{n.helper}</div>}
                {isActive
                  ? <AnswerForm onSubmit={v=>onSubmit(n.id, v)} sending={sending} compact />
                  : ans != null && (
                    <div className={'a-sum no-drag' + (expandedId===n.id ? ' expanded' : '')}
                      title="클릭하여 전체 답변 보기"
                      onClick={()=>setExpandedId(expandedId===n.id ? null : n.id)}>
                      💬 {ans}
                    </div>
                  )}
              </div>
            );
          })}

          {skeletonPos && (
            <div className="node skeleton" style={{left:skeletonPos.x, top:skeletonPos.y}}>
              <div className="sk-line" style={{width:'42%'}}></div>
              <div className="sk-line" style={{width:'88%'}}></div>
              <div className="sk-line" style={{width:'66%'}}></div>
              <div className="hint" style={{textAlign:'center'}}>다음 질문 생성 중…</div>
            </div>
          )}
        </div>

        <div className="canvas-tip">🖐 빈 공간을 드래그하여 질문 흐름을 탐색할 수 있어요</div>
        <div className="canvas-fab">
          <button className="fab no-drag" onClick={()=>centerOn(activeId || visible[visible.length-1].id)}>
            ◎ 현재 질문으로 이동
          </button>
        </div>
      </div>
    </div>
  );
}

/* =====================================================================
 * 화면 3 — 문서 생성 및 분석 대기
 * ===================================================================== */
function WaitingScreen({stages, completed, running, failed, progress, subIdx, onRetry}){
  return (
    <div className="screen waiting">
      <div style={{textAlign:'center'}}>
        <div className="hero-title" style={{fontSize:24}}>문서를 생성하고 있어요</div>
        <div className="hero-sub" style={{marginTop:8}}>
          작업은 백그라운드에서 진행됩니다 · 새로고침해도 진행 상태가 복구됩니다
        </div>
      </div>
      <div className="stages">
        {stages.map((st, i) => {
          const isDone = completed.includes(st.key);
          const isRun = running === st.key && !failed;
          const isFail = failed === st.key;
          return (
            <div key={st.key} className={'stage' + (isDone?' done':'') + (isRun?' running':'') + (isFail?' failed':'')}>
              <div className="stage-rail">
                <div className="stage-icon">
                  {isDone ? '✓' : isFail ? '✕' : isRun ? <div className="spinner"></div> : i+1}
                </div>
                {i < stages.length-1 && <div className="stage-line"></div>}
              </div>
              <div className="stage-body">
                <div className="stage-title">{st.title}</div>
                <div className="stage-sub">
                  {isDone ? '완료' : isFail ? '작업에 실패했어요. 완료된 단계는 유지됩니다.' : isRun ? st.subs[subIdx % st.subs.length] : '대기 중'}
                </div>
                {isRun && <div className="stage-bar"><div style={{width: progress + '%'}}></div></div>}
                {isFail && <button className="retry-btn" onClick={onRetry}>이 단계부터 재시도</button>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

 * 화면 4 — 분석 결과 (좌 30 : 우 70, 우측 상 70 : 하 30)

function DocPanel({title, md, filename, fnStatus, selectedFn, onFn}){
  const bodyRef = useRef(null);
  useEffect(() => {
    if(selectedFn == null || !bodyRef.current) return;
    const el = bodyRef.current.querySelector('[data-fn="'+selectedFn+'"]');
    if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
  }, [selectedFn]);
  return (
    <div className="doc-panel">
      <div className="doc-head">
        <span className="t">{title}</span>
        <span className="ok">✓ 생성 완료</span>
        <button className="dl-btn" onClick={()=>downloadMd(filename, md)}>⬇ .md 다운로드</button>
      </div>
      <div className="doc-body" ref={bodyRef}>
        <Markdown md={md} fnStatus={fnStatus} selectedFn={selectedFn} onFn={onFn} />
      </div>
    </div>
  );
}

function MetricCard({m, i, selected, onSelect}){
  const raw = useCountUp(m.value, {duration:1100 + i*120});
  const raw2 = useCountUp(m.value2, {duration:1100 + i*120});
  const [mounted, setMounted] = useState(false);
  useEffect(() => { const t = setTimeout(()=>setMounted(true), 120 + i*90); return ()=>clearTimeout(t); }, []);
  const pct = (m.max && m.value != null) ? Math.min(100, (m.value / m.max) * 100) : null;
  const statusLabel = {good:'✓ 양호', warn:'! 주의', bad:'✕ 나쁨',
    na: m.value==null ? '? 산정 불가' : 'ℹ ' + (m.naLabel||'정보')}[m.status];
  const fmt = (v) => v == null ? '' : Number(v).toLocaleString(undefined,
    {minimumFractionDigits:m.decimals||0, maximumFractionDigits:m.decimals||0});
  return (
    <div className={'metric-card' + (selected ? ' sel' : '')}
      style={{animationDelay:(i*0.07)+'s'}}
      onClick={()=>{ if(m.rel.length) onSelect(m); }}>
      <div className="metric-tip">{m.desc}</div>
      <div className="metric-label"><span className="lbl">{m.label}</span> <span className="info-dot">i</span></div>
      <div className="metric-value">
        {m.value == null ? <span style={{color:'var(--na)', fontSize:15}}>산정 불가</span> : (
          <React.Fragment>
            {fmt(raw)}
            {m.value2 != null && <span> / {Math.round(raw2).toLocaleString()}</span>}
            <span className="unit">{m.unit}</span>
          </React.Fragment>
        )}
      </div>
      <span className={'metric-status ' + m.status}>{statusLabel}</span>
      {pct != null && (
        <div className="metric-bar">
          <div className={m.status === 'na' ? 'good' : m.status} style={{width: mounted ? pct + '%' : '0%'}}></div>
        </div>
      )}
    </div>
  );
}

function ReportPanel({comp, docBLabel, summaryText, onGoto}){
  if(!comp) return (
    <div className="report-body report-empty">
      좌측 문서의 <sup className="fn st-distortion" style={{cursor:'default'}}>4</sup> 각주 번호나 상단 지표 카드를 선택하면
      해당 차이의 근거·영향·개선 제안이 여기에 표시됩니다.<br/>
      요약: {summaryText}
    </div>
  );
  const stCls = {match:'good', partial:'warn', distortion:'bad', missing:'bad', added:'warn'}[comp.statusKey];
  const sevLabel = {high:'높음', medium:'중간', low:'낮음'}[comp.severity];
  return (
    <div className="report-body" key={comp.id}>
      <div className="rp-grid">
        <div className="rp-item rp-full" style={{display:'flex', alignItems:'center', gap:10, flexWrap:'wrap'}}>
          <sup className={'fn st-'+comp.statusKey} style={{cursor:'default'}}>{comp.fn}</sup>
          <b style={{fontSize:14}}>{comp.title}</b>
          <span className={'metric-status ' + stCls}>{comp.status}</span>
          <span className={'sev ' + comp.severity}>심각도 {sevLabel}</span>
          <button className="goto-btn" onClick={()=>onGoto(comp.fn)}>문서 위치로 이동 →</button>
        </div>
        <div className="rp-item rp-full"><div className="k">차이 요약</div><div className="v">{comp.summary}</div></div>
        <div className="rp-item"><div className="k">판단 근거</div><div className="v">{comp.reason}</div></div>
        <div className="rp-item"><div className="k">의도에 미치는 영향</div><div className="v">{comp.impact}</div></div>
        <div className="rp-item"><div className="k">PRD 인용</div><div className="quote">{comp.prdQuote}</div></div>
        <div className="rp-item"><div className="k">{docBLabel} 인용</div><div className="quote trd">{comp.trdQuote}</div></div>
        <div className="rp-item"><div className="k">개선 제안</div><div className="v">💡 {comp.recommendation}</div></div>
        <div className="rp-item">
          <div className="k">분석 신뢰도</div>
          <div className="conf-bar">
            <div className="track"><div style={{width:(comp.confidence*100)+'%'}}></div></div>
            <b style={{fontSize:12.5}}>{Math.round(comp.confidence*100)}%</b>
          </div>
        </div>
      </div>
    </div>
  );
}

function ResultScreen({needsTrd}){
  const [selectedFn, setSelectedFn] = useState(null);
  // 백엔드가 넘겨주는 분석 결과를 그대로 렌더링 (TRD 포함 여부도 백엔드 응답 기준)
  const analysis = useMemo(() => getAnalysis(needsTrd), [needsTrd]);
  const fnStatus = useMemo(() => {
    const map = {}; analysis.comparisons.forEach(c => { map[c.fn] = c.statusKey; });
    return map;
  }, [analysis]);
  const comp = analysis.comparisons.find(c => c.fn === selectedFn) || null;
  const selectFn = (fn) => setSelectedFn(prev => prev === fn ? null : fn);
  return (
    <div className="screen result">
      <div className="col-docs">
        <DocPanel title="PRD" md={analysis.prd} filename="prd.md" fnStatus={fnStatus} selectedFn={selectedFn} onFn={selectFn} />
        {analysis.trd ? (
          <DocPanel title="TRD" md={analysis.trd} filename="trd.md" fnStatus={fnStatus} selectedFn={selectedFn} onFn={selectFn} />
        ) : (
          <div className="no-trd">
            ℹ TRD 미생성 — 백엔드 판단 결과, 이 프로젝트는 기술 개요 문서가 필요하지 않습니다.
          </div>
        )}
      </div>
      <div className="col-right">
        <div className="metrics-area">
          <div className="metrics-title">종합 분석 시각화</div>
          <div className="metrics-sub">
            지표 카드에 마우스를 올리면 산식 설명을 볼 수 있어요 · 카드를 클릭하면 관련 차이 항목으로 연결됩니다 ·
            분석 결과는 AI 판정으로 참고용입니다
          </div>
          <div className="metric-grid" style={{gridTemplateColumns:'repeat(' + analysis.metrics.length + ', minmax(0,1fr))'}}>
            {analysis.metrics.map((m, i) => (
              <MetricCard key={m.id} m={m} i={i}
                selected={comp != null && m.rel.indexOf(comp.id) >= 0}
                onSelect={(mm)=>{ const c = analysis.comparisons.find(cc=>cc.id===mm.rel[0]); if(c) selectFn(c.fn); }} />
            ))}
          </div>
        </div>
        <div className="report-area">
          <div className="report-head">
            <span className="t">차이 상세 리포트</span>
            {comp && <button className="dl-btn" onClick={()=>setSelectedFn(null)}>선택 해제</button>}
          </div>
          <ReportPanel comp={comp} docBLabel={analysis.docBLabel} summaryText={analysis.summaryText}
            onGoto={(fn)=>setSelectedFn(fn)} />
        </div>
      </div>
    </div>
  );
}

/* =====================================================================
 * App — 상태 머신: INITIAL → INTERVIEWING → WAITING(생성/분석) → COMPLETED
 * ===================================================================== */
const PHASES = [
  {key:'INITIAL', label:'홈'},
  {key:'INTERVIEWING', label:'인터뷰'},
  {key:'SUBMIT', label:'결과물 제출'},
  {key:'WAITING', label:'문서 생성'},
  {key:'COMPLETED', label:'분석 결과'},
];

function App(){
  const saved = useMemo(loadState, []);
  const [phase, setPhase] = useState((saved && saved.phase) || 'INITIAL');
  const [firstQ, setFirstQ] = useState(null);
  const [answers, setAnswers] = useState((saved && saved.answers) || {});
  const [activeId, setActiveId] = useState((saved && saved.activeId) || null);
  const [sending, setSending] = useState(false);
  const [expandedId, setExpandedId] = useState(null);
  const [showLeave, setShowLeave] = useState(false);
  // Input 1 (선택) — 기존 계획 문서
  const [doc, setDoc] = useState((saved && saved.doc) || {status:'none', name:null, extracted:null});
  // 백엔드 판단: TRD 생성 여부
  const [needsTrd, setNeedsTrd] = useState(saved ? !!saved.needsTrd : true);

  // 대기 화면 상태 (완료 단계는 복구 — FR-10 / 수용기준 14)
  const [completed, setCompleted] = useState((saved && saved.completed) || []);
  const [running, setRunning] = useState(null);
  const [failed, setFailed] = useState(null);
  const [progress, setProgress] = useState(0);
  const [subIdx, setSubIdx] = useState(0);

  // 세션 시작 (로그인 없이 session token 발급 시뮬레이션)
  useEffect(() => {
    if(phase !== 'INITIAL') return;
    let alive = true;
    mockApi.createSession().then(res => { if(alive) setFirstQ(res.firstQuestion); });
    return () => { alive = false; };
  }, [phase]);

  // 상태 영속화 (새로고침 복구)
  useEffect(() => {
    saveState({phase, answers, activeId, completed, doc, needsTrd});
  }, [phase, answers, activeId, completed, doc, needsTrd]);

  const visible = useMemo(() => {
    const ids = ORDER.filter(id => answers[id] != null || id === activeId);
    return ids.map(id => QUESTIONS[id]);
  }, [answers, activeId]);

  const submitAnswer = async (qid, value) => {
    if(sending) return; // 중복 제출 방지
    setSending(true);
    try{
      const res = await mockApi.submitAnswer(qid, value);
      setAnswers(a => Object.assign({}, a, {[qid]: value}));
      if(res.done){
        setActiveId(null);
        setPhase('SUBMIT'); // 질문 종료 → 최종 결과물 제출 단계로
      } else {
        setActiveId(res.next.id);
        setPhase('INTERVIEWING');
      }
    } finally {
      setSending(false);
    }
  };

  const uploadDoc = async (name) => {
    setDoc({status:'processing', name, extracted:null});
    const res = await mockApi.preprocessDoc(name);
    setDoc({status:'done', name, extracted:res.extracted});
  };

  const submitResult = async (text) => {
    if(sending) return;
    setSending(true);
    try{
      const res = await mockApi.submitResult(text); // 백엔드가 TRD 필요 여부 판단
      setNeedsTrd(res.needsTrd);
      setPhase('WAITING');
    } finally {
      setSending(false);
    }
  };

  const stages = useMemo(() => getStages(needsTrd), [needsTrd]);

  // 생성/분석 job 실행 (단계 순차 진행, 완료 단계는 재실행하지 않음)
  useEffect(() => {
    if(phase !== 'WAITING' || failed) return;
    const next = stages.find(s => completed.indexOf(s.key) < 0);
    if(!next){ const t = setTimeout(()=>setPhase('COMPLETED'), 500); return ()=>clearTimeout(t); }
    setRunning(next.key); setProgress(0);
    const dur = 2600;
    const t0 = Date.now();
    const iv = setInterval(() => {
      const p = Math.min(100, ((Date.now()-t0)/dur)*100);
      setProgress(p);
      if(p >= 100){
        clearInterval(iv);
        setCompleted(c => c.concat([next.key]));
      }
    }, 60);
    const sv = setInterval(() => setSubIdx(i => i+1), 900);
    return () => { clearInterval(iv); clearInterval(sv); };
  }, [phase, completed, failed, stages]);

  const goHome = () => {
    clearState();
    setAnswers({}); setActiveId(null); setCompleted([]); setFailed(null);
    setDoc({status:'none', name:null, extracted:null}); setNeedsTrd(true);
    setFirstQ(null); setPhase('INITIAL'); setShowLeave(false);
  };
  const onHomeClick = () => {
    if(phase === 'INTERVIEWING' || phase === 'SUBMIT' || phase === 'WAITING') setShowLeave(true);
    else goHome();
  };

  const phaseIdx = PHASES.findIndex(p => p.key === phase);

  return (
    <div className="shell">
      <div className="topbar">
        <button className="home-btn" onClick={onHomeClick} title="홈으로">
          <span className="logo-dot">◈</span> mat-copilot
        </button>
        <div className="phase-steps">
          {PHASES.map((p, i) => (
            <React.Fragment key={p.key}>
              {i > 0 && <span className="phase-arrow">▸</span>}
              <span className={'phase-step' + (i === phaseIdx ? ' on' : i < phaseIdx ? ' done' : '')}>
                {i < phaseIdx ? '✓ ' : ''}{p.label}
              </span>
            </React.Fragment>
          ))}
        </div>
      </div>
      <div className="main">
        {phase === 'INITIAL' && (
          <HomeScreen question={firstQ} loading={!firstQ} sending={sending}
            doc={doc} onUpload={uploadDoc}
            onSubmit={(v)=>submitAnswer('q1', v)} />
        )}
        {phase === 'SUBMIT' && (
          <SubmitScreen onSubmit={submitResult} sending={sending} />
        )}
        {phase === 'INTERVIEWING' && (
          <InterviewScreen visible={visible} answers={answers} activeId={activeId}
            sending={sending} onSubmit={submitAnswer}
            expandedId={expandedId} setExpandedId={setExpandedId} />
        )}
        {phase === 'WAITING' && (
          <WaitingScreen stages={stages} completed={completed} running={running} failed={failed}
            progress={progress} subIdx={subIdx} onRetry={()=>setFailed(null)} />
        )}
        {phase === 'COMPLETED' && <ResultScreen needsTrd={needsTrd} />}
      </div>

      {showLeave && (
        <div className="modal-back" onClick={()=>setShowLeave(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h4>홈으로 이동할까요?</h4>
            <p>진행 중인 인터뷰/생성 작업이 초기화됩니다. 이 동작은 되돌릴 수 없어요.</p>
            <div className="modal-actions">
              <button className="btn-ghost" onClick={()=>setShowLeave(false)}>계속 진행</button>
              <button className="btn-danger" onClick={goHome}>홈으로 이동</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
